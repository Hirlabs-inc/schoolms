# Netlify deploy config for school-management-system
#
# Strategy: prerendered pages are served as static CDN assets; the 4 API routes
# (app/api/auth/*, app/api/db) are deployed as Netlify Functions. This keeps the
# server-side DB token + JWT secret off the client (secure) while the UI is static.
#
# Do NOT use `output: 'export'` here — it would strip the API routes. The
# @netlify/plugin-nextjs handles the static-pages + serverless-functions split
# automatically from a normal `next build`.

[build]
  command = "next build"
  # The Next.js plugin manages the output; .next is the build directory.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables for the serverless functions (API routes).
# Set these in the Netlify dashboard (Site settings -> Environment variables)
# as well, or they are read from the build/deploy context:
[build.environment]
  NEXT_PUBLIC_APP_NAME = "SchoolMS"

# Functions runtime config (Node 20 matches the local/dev runtime).
[functions]
  node_bundler = "esbuild"
  included_files = ["package.json"]
