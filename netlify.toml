# Netlify deploy config — HYBRID: static export + serverless functions.
#
# `next build` with `output: 'export'` emits a static `out/` folder (all pages).
# The 4 API routes live as Netlify Functions under netlify/functions/ and are
# served at /.netlify/functions/<name>. The /api/* redirect below maps the
# client's existing calls (/api/db, /api/auth/login, ...) to those functions.
#
# This keeps the DB token + JWT secret server-side (secure) while the UI is a
# pure static folder you can also drag-drop to Netlify.

[build]
  command = "next build"
  publish = "out"

# Netlify Functions (TypeScript, bundled by Netlify). Env vars TURSO_URL,
# TURSO_TOKEN, JWT_SECRET are provided in the Netlify dashboard and injected
# into these functions at runtime.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Map /api/* -> /.netlify/functions/:splat (200 proxy keeps method/headers/body).
# e.g. /api/db -> /.netlify/functions/db ; /api/auth/login -> /.netlify/functions/auth/login
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback: serve index.html for unknown non-asset routes (client routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
